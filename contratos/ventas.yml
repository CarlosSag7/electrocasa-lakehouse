
fuente: ventas
version: 1
ultima_actualizacion: "2026-11-24"

responsable: "<PENDIENTE: area responsable del dato>"

llegada: "Archivos CSV con encabezado en /Volumes/electrocasa_dev/default/vol_landing/ventas/"

metodo_ingesta: "Auto Loader mediante Lakeflow Spark Declarative Pipelines"

frecuencia_esperada: "<PENDIENTE: frecuencia de llegada de los lotes>"

tabla_bronze: "electrocasa_dev.bronze.ventas_bronze"

tabla_silver: "electrocasa_dev.silver.ventas_silver"

llave: "venta_id"

columnas:

  - nombre: venta_id
    tipo: STRING
    nulo: false
    descripcion: "Identificador unico de la venta."
    llave_primaria: true
    regla: "No debe ser nulo ni estar duplicado."

  - nombre: sucursal_id
    tipo: STRING
    nulo: true
    descripcion: "Identificador de la sucursal donde se realizo la venta."
    regla: "Se espera un identificador para ventas de tienda fisica. La ausencia en ecommerce requiere validacion de negocio."
    valores_observados: "32 registros sin valor: 26 tienda_fisica y 6 ecommerce."

  - nombre: producto_id
    tipo: STRING
    nulo: false
    descripcion: "Identificador del producto vendido."
    regla: "No debe ser nulo ni estar vacio."

  - nombre: vendedor_id
    tipo: STRING
    nulo: true
    descripcion: "Identificador del vendedor asociado a la venta."
    regla: "Obligatorio para tienda_fisica. Puede estar vacio para ecommerce."
    valores_observados: "2056 registros sin valor, todos correspondientes a ecommerce."

  - nombre: cantidad
    tipo: STRING
    nulo: false
    tipo_silver: INTEGER
    descripcion: "Cantidad de unidades vendidas."
    regla: "Debe ser un numero entero mayor que cero."
    valores_observados: "22 registros con cantidad igual a cero."

  - nombre: monto_total
    tipo: STRING
    nulo: true
    tipo_silver: DECIMAL(12,2)
    descripcion: "Importe total de la venta."

    regla: "Convertir los importes a DECIMAL(12,2), reconociendo el formato decimal estándar y el formato europeo."

    formatos_observados:
      - formato: "Decimal estandar con punto"
        ejemplo: "1167.06"
        tratamiento: "Conversion directa a DECIMAL(12,2)."

      - formato: "Europeo con separador de miles"
        ejemplo: "1.167,06"
        registros: 83
        tratamiento: "Eliminar puntos de miles y reemplazar coma decimal por punto."

      - formato: "Europeo sin separador de miles"
        ejemplo: "965,91"
        registros: 9
        tratamiento: "Reemplazar coma decimal por punto."

    valores_observados:
      nulos_o_vacios: 58
      formato_europeo: 92
      valores_cero: 28
      valores_negativos: 41

    observacion: "Los 92 valores que no admitian conversion directa fueron convertidos correctamente mediante la normalizacion del formato europeo."

  - nombre: metodo_pago
    tipo: STRING
    nulo: false
    descripcion: "Medio de pago utilizado en la venta."

    valores_observados:
      - "EFECTIVO"
      - "EFV"
      - "Efectivo"
      - "efectivo"
      - "PLIN"
      - "Plin"
      - "YAPE"
      - "Yape"
      - "yape"
      - "TARJETA"
      - "tarjeta"
      - "TC"
      - "Tarjeta de credito"
      - "td"
      - "TRF"
      - "Transferencia"
      - "transferencia"

    valores_normalizados:
      - "EFECTIVO"
      - "PLIN"
      - "YAPE"
      - "TRANSFERENCIA"
      - "TARJETA_CREDITO"
      - "TARJETA_DEBITO"
      - "TARJETA"

    reglas_normalizacion:
      - origen: ["EFECTIVO", "EFV", "Efectivo", "efectivo"]
        destino: "EFECTIVO"

      - origen: ["PLIN", "Plin"]
        destino: "PLIN"

      - origen: ["YAPE", "Yape", "yape"]
        destino: "YAPE"

      - origen: ["TRF", "Transferencia", "transferencia"]
        destino: "TRANSFERENCIA"

      - origen: ["TC", "Tarjeta de credito"]
        destino: "TARJETA_CREDITO"

      - origen: ["td"]
        destino: "TARJETA_DEBITO"

      - origen: ["TARJETA", "tarjeta"]
        destino: "TARJETA"

  - nombre: fecha_venta
    tipo: STRING
    nulo: false
    tipo_silver: DATE
    descripcion: "Fecha en que se realizo la venta."
    formatos_observados:
      - formato: "yyyy-MM-dd"
        registros: 5446
      - formato: "dd/MM/yyyy"
        registros: 776
      - formato: "yyyy-MM-ddTHH:mm:ss"
        registros: 561
    regla: "Convertir los formatos reconocidos a DATE."

  - nombre: canal
    tipo: STRING
    nulo: false
    descripcion: "Canal mediante el cual se realizo la venta."
    valores_observados:
      - "ecommerce"
      - "tienda_fisica"
    regla: "Conservar y validar los dos valores observados."

reglas_de_calidad:

  - nombre: venta_id_unico
    condicion: "venta_id IS NOT NULL AND venta_id <> ''"
    politica: "drop"
    destino_rechazos: null
    justificacion: "La llave de negocio es obligatoria. Se identificaron 118 filas duplicadas exactas por venta_id en los dos lotes. Se conserva una sola fila en Silver y los datos originales permanecen en Bronze."
  
  - nombre: cantidad_positiva
    condicion: "TRY_CAST(cantidad AS INT) > 0"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.ventas_rechazadas"
    justificacion: "En la validación consolidada de los dos lotes se identificaron 55 registros con cantidad inválida. Se conservan en ventas_rechazadas con su motivo correspondiente."

  - nombre: monto_total_valido
    condicion: "monto_total convertido a DECIMAL(12,2) y mayor que cero"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.ventas_rechazadas"
    justificacion: "En los dos lotes se identificaron 263 registros con importe inválido: 109 nulos, 61 iguales a cero y 93 negativos. Los registros se conservan en la tabla de rechazadas."


  - nombre: vendedor_requerido_tienda_fisica
    condicion: "canal = 'tienda_fisica' implica vendedor_id IS NOT NULL AND vendedor_id <> ''"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.ventas_rechazadas"
    justificacion: "El vendedor es obligatorio para ventas de tienda física. En el primer lote se identificaron 2056 registros sin vendedor, todos correspondientes a ecommerce. En la validación consolidada no se encontraron rechazos por vendedor faltante en tienda física."

  - nombre: sucursal_requerida_tienda_fisica
    condicion: "canal = 'tienda_fisica' implica sucursal_id IS NOT NULL AND sucursal_id <> ''"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.ventas_rechazadas"
    justificacion: "La sucursal es obligatoria para ventas de tienda física. En la validación consolidada se identificaron 58 registros de tienda_fisica sin sucursal_id; todos fueron rechazados."

  - nombre: metodo_pago_normalizado
    condicion: "metodo_pago debe corresponder a una de las siete categorias normalizadas"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.ventas_rechazadas"
    justificacion: "Se identificaron 17 variantes originales de métodos de pago. Se normalizaron a siete categorías. Los valores no reconocidos se rechazan y conservan su motivo en la tabla de rechazadas."

transformaciones_silver:

 transformaciones_silver:

  - "Limpiar espacios en blanco y convertir valores vacios en NULL en las columnas de texto."
  - "Convertir cantidad de STRING a INTEGER."
  - "Convertir monto_total a DECIMAL(12,2), considerando los formatos numericos estandar y europeos."
  - "Convertir fecha_venta a DATE mediante reconocimiento de los tres formatos observados."
  - "Normalizar metodo_pago utilizando las equivalencias documentadas."
  - "Normalizar canal a minusculas."
  - "Validar que venta_id y producto_id sean obligatorios."
  - "Validar que cantidad y monto_total sean mayores que cero."
  - "Validar que vendedor_id y sucursal_id sean obligatorios para tienda_fisica."
  - "Separar los registros que incumplen las reglas de calidad en ventas_rechazadas, conservando sus motivos."
  - "Excluir duplicados exactos por venta_id de ventas_silver, conservando una sola fila."
  - "Preservar los datos originales en Bronze."

problemas_conocidos:

  - problema: "Importes con formato europeo."
    ejemplo: "1.167,06 y 965,91"
    filas_afectadas: 92
    tratamiento: "En el primer lote se identificaron 92 importes con formato europeo. Se normalizaron los separadores de miles y decimales antes de convertir a DECIMAL(12,2)."

  - problema: "Vendedor ausente en ventas ecommerce."
    ejemplo: "vendedor_id vacio con canal ecommerce."
    filas_afectadas: 2056
    tratamiento: "Permitir vendedor_id nulo para ecommerce. Exigirlo para tienda_fisica."

  - problema: "Sucursal ausente."
    ejemplo: "sucursal_id vacio en registros de tienda_fisica."
    filas_afectadas: 58
    tratamiento: "En el primer lote se identificaron 2056 registros sin vendedor, todos correspondientes a ecommerce. Se permite vendedor_id nulo para ecommerce y se exige para tienda_fisica."

  - problema: "Cantidad inválida."
    ejemplo: "cantidad nula, no convertible o menor o igual a cero."
    filas_afectadas: 55
    tratamiento: "Los 55 registros identificados en la validación consolidada fueron enviados a ventas_rechazadas. Silver conserva únicamente cantidades mayores que cero."


  - problema: "Importes nulos o vacios."
    ejemplo: "monto_total sin valor."
    filas_afectadas: 109
    tratamiento: "No reemplazar por cero. Los registros fueron enviados a ventas_rechazadas."

  - problema: "Importes iguales a cero."
    ejemplo: "monto_total = 0."
    filas_afectadas: 61
    tratamiento: "Los registros fueron enviados a ventas_rechazadas porque el importe debe ser mayor que cero."

  - problema: "Importes negativos."
    ejemplo: "monto_total = -1969.19"
    filas_afectadas: 93
    tratamiento: "Los registros se conservan en Bronze y fueron enviados a ventas_rechazadas. No se consideran ventas válidas en Silver."

  - problema: "Multiples formatos de fecha."
    ejemplo: "2026-04-16, 16/04/2026, 2026-04-16T10:30:00"
    filas_afectadas: 1337
    tratamiento: "En el primer lote se identificaron 1337 registros con formatos de fecha distintos. Se reconocen los tres formatos y se convierten a DATE."

  - problema: "Multiples variantes de metodo de pago."
    ejemplo: "EFECTIVO, EFV, efectivo, TC, td, TARJETA."
    filas_afectadas: 6783
    tratamiento: "En el primer lote se identificaron 6783 registros con variantes de métodos de pago. Se normalizan a siete categorías, conservando la distinción entre crédito, débito y tarjeta genérica."

  - problema: "Ventas duplicadas por venta_id."
    ejemplo: "Dos registros con el mismo venta_id y contenido identico."
    filas_afectadas: 118
    tratamiento: "Se identificaron 118 filas duplicadas exactas en los dos lotes. Se conserva una sola fila por venta_id en ventas_silver. Los registros originales permanecen en Bronze."


resumen_ingesta:
  - lotes_procesados:
    - archivo: "ventas_lote_01_2026-05-31.csv"
      registros: 6783
    - archivo: "ventas_lote_02_2026-08-31.csv"
      registros: 6839

  - resultados_bronze:
    total_registros: 13622

  - resultados_silver:
    ventas_validas: 13132
    registros_rechazados: 372
    filas_duplicadas_excluidas: 118
    duplicados_restantes: 0

  - validacion:
    clasificacion_completa: true
    deduplicacion_verificada: true
    segunda_ejecucion_sin_nuevos_duplicados: true