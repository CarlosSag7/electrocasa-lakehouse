# Contrato de datos: Empleados (RR.HH.)
#
# Plantilla base. Reemplaza cada "<completar>" con lo que encuentres al explorar
# la fuente en Bronze. Cuando el contrato esté listo, puedes borrar estos comentarios.
# El contrato tiene que coincidir con tu código: los tipos de Silver y las
# expectativas del pipeline son los que declaras aquí.

fuente: empleados
version: 1
ultima_actualizacion: "<AAAA-MM-DD>"
responsable: "<completar>"            # área de ElectroCasa dueña del dato
llegada: "<completar>"                # formato y ruta del volume donde aterrizan los archivos
metodo_ingesta: "<completar>"         # Auto Loader o COPY INTO, y por qué
frecuencia_esperada: "<completar>"
tabla_bronze: "<catalogo>.bronze.<completar>"
tabla_silver: "<catalogo>.silver.<completar>"
# Cada fila es un evento, no un empleado. Distingue las dos llaves:
llave_evento: "<completar>"           # qué identifica una fila de la fuente
llave_entidad: "<completar>"          # qué identifica a un empleado en la tabla historizada
historizacion:
  tipo: SCD Type 2                     # una versión por cambio, con su intervalo de vigencia
  implementacion: "<completar>"       # AUTO CDC (stored_as_scd_type=2) o intervalos armados a mano
  columnas_de_vigencia: ["<completar>"]  # las que dicen desde y hasta cuándo vale cada versión
  orden_de_los_cambios: "<completar>" # columnas de la fuente que definen el orden (nunca current_timestamp())
  eventos_mismo_dia: "<completar>"    # cómo decides cuál fue primero
  llegada_tardia: "<completar>"       # qué pasa con un evento de junio que llega en el lote de octubre

columnas:
  # Una entrada por columna, con el tipo que va a tener en Silver.
  # "regla" es opcional: úsala cuando la columna tenga una restricción propia.
  # "sensible" marca las columnas que llevan masking.
  - nombre: id_empleado
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: nombre
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: dni
    tipo: "<completar>"
    nulo: "<true | false>"
    sensible: true
    masking: "<completar>"            # función de máscara y quién ve el valor real
  - nombre: email
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: salario
    tipo: "<completar>"
    nulo: "<true | false>"
    regla: "<completar>"
    sensible: true
    masking: "<completar>"
  - nombre: sucursal_id
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: cargo
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: tipo_evento
    tipo: "<completar>"
    nulo: "<true | false>"
    valores_permitidos: ["<completar>"]   # los tipos de evento después de estandarizar
  - nombre: fecha_evento
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: fecha_registro
    tipo: "<completar>"
    nulo: "<true | false>"

reglas_de_calidad:
  # Una entrada por expectativa del pipeline. Política: warn, drop o fail.
  - nombre: evento_ubicable
    condicion: "<completar>"          # id_empleado y fecha_evento no nulos
    politica: "<warn | drop | fail>"
    destino_rechazos: "<completar>"   # tabla o log donde se consultan los rechazos
    justificacion: "<completar>"      # por qué esa política para este dato
  - nombre: "<completar>"
    condicion: "<completar>"
    politica: "<warn | drop | fail>"
    destino_rechazos: "<completar>"
    justificacion: "<completar>"

transformaciones_silver:
  # Normalizaciones que aplicas antes de historizar.
  - "<completar>"

problemas_conocidos:
  # Lo que encontraste al explorar Bronze, con un ejemplo real y cuántas filas afecta.
  - problema: "<completar>"
    ejemplo: "<completar>"
    filas_afectadas: "<completar>"
    tratamiento: "<completar>"        # qué regla o transformación lo resuelve
