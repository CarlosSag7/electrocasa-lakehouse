# Contrato de datos: Tracking de envíos
#
# Plantilla base. Reemplaza cada "<completar>" con lo que encuentres al explorar
# la fuente en Bronze. Cuando el contrato esté listo, puedes borrar estos comentarios.
# El contrato tiene que coincidir con tu código: los tipos de Silver y las
# expectativas del pipeline son los que declaras aquí.
# No pongas aquí el host, el usuario ni la contraseña de la base: solo el nombre de la Connection.

fuente: tracking_envios
version: 1
ultima_actualizacion: "<AAAA-MM-DD>"
responsable: "<completar>"            # quién provee el dato (el courier, a través de ElectroCasa)
llegada: "Azure SQL Database, tabla dbo.TrackingEnvios"
metodo_ingesta: "Conector query-based de SQL Server (Lakeflow Connect)"
connection_unity_catalog: "<completar>"   # nombre de tu Connection de Unity Catalog
cursor: fecha_modificacion
modo_historia: "<completar>"          # SCD Type 1 o append only, y por qué
frecuencia_esperada: "<completar>"
tabla_bronze: "<catalogo>.bronze.tracking_envios"   # destino del conector
tabla_silver: "<catalogo>.silver.<completar>"
llave: evento_id                      # tracking_id se repite por diseño: no sirve como llave del conector
depende_de:
  - fuente: ventas
    columna: venta_id

columnas:
  # Una entrada por columna, con el tipo que va a tener en Silver.
  # "regla" es opcional: úsala cuando la columna tenga una restricción propia.
  - nombre: evento_id
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: tracking_id
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: venta_id
    tipo: "<completar>"
    nulo: "<true | false>"
    regla: "<completar>"              # ¿qué haces si la venta no existe?
  - nombre: courier
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: estado_entrega
    tipo: "<completar>"
    nulo: "<true | false>"
    valores_permitidos: ["<completar>"]   # los estados después de estandarizar
  - nombre: sucursal_origen
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: fecha_actualizacion
    tipo: "<completar>"
    nulo: "<true | false>"
  - nombre: fecha_modificacion
    tipo: "<completar>"
    nulo: "<true | false>"

reglas_de_calidad:
  # Una entrada por expectativa del pipeline. Política: warn, drop o fail.
  - nombre: estado_conocido
    condicion: "<completar>"          # estado dentro del conjunto cerrado, después de estandarizar
    politica: "<warn | drop | fail>"
    destino_rechazos: "<completar>"   # tabla o log donde se consultan los rechazos
    justificacion: "<completar>"      # por qué esa política para este dato
  - nombre: "<completar>"
    condicion: "<completar>"
    politica: "<warn | drop | fail>"
    destino_rechazos: "<completar>"
    justificacion: "<completar>"

transformaciones_silver:
  # Normalizaciones y deduplicación que aplicas antes de escribir en Silver
  # (por ejemplo, cómo detectas un mensaje reprocesado con otro evento_id).
  - "<completar>"

problemas_conocidos:
  # Lo que encontraste al explorar Bronze, con un ejemplo real y cuántas filas afecta.
  - problema: "<completar>"
    ejemplo: "<completar>"
    filas_afectadas: "<completar>"
    tratamiento: "<completar>"        # qué regla o transformación lo resuelve
